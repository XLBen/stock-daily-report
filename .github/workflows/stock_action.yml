name: Quant Monitor (CI Only)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Dry-Run Test Cycle
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          ALPACA_KEY_LEFT: ${{ secrets.ALPACA_KEY_LEFT }}
          ALPACA_SECRET_LEFT: ${{ secrets.ALPACA_SECRET_LEFT }}
          ALPACA_KEY_RIGHT: ${{ secrets.ALPACA_KEY_RIGHT }}
          ALPACA_SECRET_RIGHT: ${{ secrets.ALPACA_SECRET_RIGHT }}
          ALPACA_KEY_EXTREME: ${{ secrets.ALPACA_KEY_EXTREME }}
          ALPACA_SECRET_EXTREME: ${{ secrets.ALPACA_SECRET_EXTREME }}
        run: python main.py --test-cycle --dry-run
